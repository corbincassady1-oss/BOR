name: Build PelvisHandSync
on:
  push:
    branches: [pelvishandsync-fix]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Get BoneLib
        run: |
          mkdir -p PelvisHandSyncFix/lib
          curl -L --fail -o bonelib.zip https://github.com/yowchap/BoneLib/releases/download/v3.2.2/BoneLib.zip
          unzip -q bonelib.zip -d bonelib
          find bonelib -name BoneLib.dll -exec cp {} PelvisHandSyncFix/lib/BoneLib.dll \;
          test -s PelvisHandSyncFix/lib/BoneLib.dll
      - name: Build compile-time Marrow stub
        run: |
          dotnet build PelvisHandSyncFix/MarrowStub/MarrowStub.csproj -c Release --nologo
          cp PelvisHandSyncFix/MarrowStub/bin/Release/net6.0/Il2CppSLZ.Marrow.dll PelvisHandSyncFix/lib/Il2CppSLZ.Marrow.dll
      - name: Build
        run: dotnet build PelvisHandSyncFix/PelvisHandSync.csproj -c Release --nologo
      - name: Verify
        run: |
          test -s PelvisHandSyncFix/bin/Release/net6.0/PelvisHandSync.dll
          file PelvisHandSyncFix/bin/Release/net6.0/PelvisHandSync.dll
      - uses: actions/upload-artifact@v4
        with:
          name: PelvisHandSync-fixed
          path: PelvisHandSyncFix/bin/Release/net6.0/PelvisHandSync.dll
