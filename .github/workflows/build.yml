name: Build BulletOverdrive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get official MelonLoader reference
        shell: bash
        run: |
          mkdir -p BulletOverdrive/References
          curl -L --fail --retry 3 -o /tmp/MelonLoader.zip             https://github.com/LavaGang/MelonLoader/releases/download/v0.6.6/MelonLoader.x64.zip
          unzip -q /tmp/MelonLoader.zip -d /tmp/melon
          ML_DLL="$(find /tmp/melon -type f -name 'MelonLoader.dll' | head -n 1)"
          test -n "$ML_DLL"
          cp "$ML_DLL" BulletOverdrive/References/MelonLoader.dll

      - name: Build
        run: dotnet build BulletOverdrive/BulletOverdrive.csproj -c Release --nologo

      - name: Prepare Fusion Player Teleporter
        shell: bash
        run: |
          mkdir -p FusionPlayerTeleporter/References
          cp /tmp/melon/MelonLoader/MelonLoader.dll FusionPlayerTeleporter/References/MelonLoader.dll 2>/dev/null || cp "$(find /tmp/melon -type f -name 'MelonLoader.dll' | head -n 1)" FusionPlayerTeleporter/References/MelonLoader.dll
          HARMONY="$(find /tmp/melon -type f -name 'HarmonyLib.dll' | head -n 1)"
          if [ -z "$HARMONY" ]; then
            HARMONY="$(find /tmp/melon -type f -name '0Harmony.dll' | head -n 1)"
          fi
          if [ -z "$HARMONY" ]; then
            HARMONY="$(find /tmp/melon -type f -name 'HarmonyX.dll' | head -n 1)"
          fi
          test -n "$HARMONY"
          cp "$HARMONY" FusionPlayerTeleporter/References/HarmonyLib.dll

      - name: Build Fusion Player Teleporter
        run: dotnet build FusionPlayerTeleporter/FusionPlayerTeleporter.csproj -c Release --nologo

      - name: Verify Fusion Player Teleporter
        run: |
          test -f FusionPlayerTeleporter/FusionPlayerTeleporter.dll
          file FusionPlayerTeleporter/FusionPlayerTeleporter.dll

      - name: Upload Fusion Player Teleporter DLL
        uses: actions/upload-artifact@v4
        with:
          name: FusionPlayerTeleporter-DLL
          path: FusionPlayerTeleporter/FusionPlayerTeleporter.dll
          if-no-files-found: error

      - name: Publish Fusion Player Teleporter DLL
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin build:refs/remotes/origin/build || true
          git checkout -B build
          mkdir -p releases
          cp FusionPlayerTeleporter/FusionPlayerTeleporter.dll releases/FusionPlayerTeleporter.dll
          git add releases/FusionPlayerTeleporter.dll
          git commit -m "Build FusionPlayerTeleporter.dll" || true
          git push origin build

      - name: Verify output
        run: |
          test -f BulletOverdrive/BulletOverdrive.dll
          file BulletOverdrive/BulletOverdrive.dll

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulletOverdrive-DLL
          path: BulletOverdrive/BulletOverdrive.dll
          if-no-files-found: error

      - name: Publish built DLL to build branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin build:refs/remotes/origin/build || true
          git checkout -B build
          mkdir -p releases
          cp BulletOverdrive/BulletOverdrive.dll releases/BulletOverdrive.dll
          git add releases/BulletOverdrive.dll
          git commit -m "Build BulletOverdrive.dll" || true
          git push origin build
